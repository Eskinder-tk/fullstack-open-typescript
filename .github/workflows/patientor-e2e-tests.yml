name: Patientor E2E Tests

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install backend dependencies
      working-directory: ./patientor/backend
      run: npm install --legacy-peer-deps

    - name: Install & build frontend
      working-directory: ./patientor/frontend
      run: |
        npm install --legacy-peer-deps
        npm run build

    - name: Install E2E test dependencies & browsers
      working-directory: ./patientor-tests
      run: |
        npm install
        npx playwright install --with-deps chromium

    - name: Start servers and run tests
      run: |
        cd patientor/backend && npm start &
        cd patientor/frontend && npx vite preview --port 5173 &
        npx wait-on http://localhost:3001/api/ping http://localhost:5173 --timeout 60000
        cd patientor-tests && npm test

    - name: Upload test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: patientor-tests/playwright-report/
        retention-days: 30