name: Patientor API Tests

on:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: |
          patientor/backend/package-lock.json
          patientor-api-tests/package-lock.json

    - name: Install patientor backend dependencies
      working-directory: ./patientor/backend
      run: npm install --legacy-peer-deps

    - name: Lint patientor backend
      working-directory: ./patientor/backend
      run: npm run lint

    - name: Install test dependencies
      working-directory: ./patientor-api-tests
      run: npm install

    - name: Install Playwright browsers
      working-directory: ./patientor-api-tests
      run: npx playwright install --with-deps chromium

    - name: Start backend and run API tests
      working-directory: ./patientor-api-tests
      run: |
        npm start --prefix ../patientor/backend &
        npx wait-on http://127.0.0.1:3001
        npm test

    - name: Upload test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: patientor-api-tests/playwright-report/
        retention-days: 30